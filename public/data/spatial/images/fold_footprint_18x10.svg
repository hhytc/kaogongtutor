<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:22px;font-weight:700}.label{font-size:17px}.small{font-size:14px}.blue{fill:#c8e0fa;stroke:#1e3a5f;stroke-width:1.5}</style><text class="title" x="28" y="38">18×10 纸张沿两条互相垂直的中线对折</text><rect x="90" y="100" width="540" height="300" fill="#f8fafc" stroke="#334155" stroke-width="2"/><line x1="360" y1="100" x2="360" y2="400" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 5"/><line x1="90" y1="250" x2="630" y2="250" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/><text class="label" x="360" y="86" text-anchor="middle">原纸面积 18×10</text><text class="small" x="360" y="240" text-anchor="middle">两条折线均为中线</text><rect x="690" y="190" width="180" height="100" class="blue"/><text class="small" x="780" y="178" text-anchor="middle">折后投影 9×5</text><text class="small" x="90" y="430">不裁切、不拉伸；材料面积保持不变。</text></svg>