<svg xmlns="http://www.w3.org/2000/svg" width="850" height="360" viewBox="0 0 850 360">
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:22px;font-weight:700}.label{font-size:16px}.small{font-size:13px}.grid{stroke:#64748b;stroke-width:1.4}.axis{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.cell{fill:#e8eef7;stroke:#475569;stroke-width:1.4}.blue{fill:#4f8edb;stroke:#1e3a5f;stroke-width:1.5}.ink{fill:#1f2937}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<text class="title" x="28" y="38">单个正方体的一个角被平面切去</text><path d="M180 110 L360 110 L360 290 L180 290 Z" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M180 110 L245 58 L425 58 L360 110" fill="#e8eef7" stroke="#334155" stroke-width="2"/><path d="M360 110 L425 58 L425 238 L360 290" fill="#dbe4ef" stroke="#334155" stroke-width="2"/><polygon points="180,110 245,58 225,110" fill="#fca5a5" stroke="#991b1b" stroke-width="2"/><line x1="245" y1="58" x2="225" y2="110" stroke="#991b1b" stroke-width="2" stroke-dasharray="5 4"/><text class="small" x="475" y="118">切平面截同一顶点的三条相邻棱</text><text class="small" x="475" y="146">截距均非零，三角形各边由两条垂直棱段构成</text><text class="small" x="475" y="174">图形为示意；题目考查边长关系</text></svg>