<text class="title" x="28" y="38">参考构型：4 个单位立方体；x、y、z 轴正向见箭头</text><polygon points="250,126 302,96 250,66 198,96" fill="#f8fafc" stroke="#334155" stroke-width="2"/><polygon points="250,128 302,98 250,68 198,98" fill="#f8fafc" stroke="#334155" stroke-width="2"/><polygon points="302,158 250,128 250,66 302,96" fill="#c7d2e0" stroke="#334155" stroke-width="2"/><polygon points="198,158 250,128 250,66 198,96" fill="#dbe4ef" stroke="#334155" stroke-width="2"/><polygon points="302,160 250,130 250,68 302,98" fill="#c7d2e0" stroke="#334155" stroke-width="2"/><polygon points="198,160 250,130 250,68 198,98" fill="#dbe4ef" stroke="#334155" stroke-width="2"/><polygon points="198,158 250,128 198,98 146,128" fill="#f8fafc" stroke="#334155" stroke-width="2"/><polygon points="146,190 198,160 198,98 146,128" fill="#dbe4ef" stroke="#334155" stroke-width="2"/><polygon points="302,220 250,190 250,128 302,158" fill="#c7d2e0" stroke="#334155" stroke-width="2"/><line class="axis" x1="250" y1="250" x2="370" y2="250"/><text class="label" x="380" y="255">x</text><line class="axis" x1="250" y1="250" x2="145" y2="250"/><text class="label" x="128" y="255">y</text><line class="axis" x1="250" y1="250" x2="250" y2="80"/><text class="label" x="260" y="75">z</text><text class="small" x="500" y="145">坐标列表以左下前角为原点</text><text class="small" x="500" y="173">每个三元组表示一个单位块的左下前角</text></svg>