<style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:22px;font-weight:700}.label{font-size:16px}.small{font-size:13px}.grid{stroke:#64748b;stroke-width:1.4}.axis{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.cell{fill:#e8eef7;stroke:#475569;stroke-width:1.4}.blue{fill:#4f8edb;stroke:#1e3a5f;stroke-width:1.5}.ink{fill:#1f2937}</style>
