rial,sans-serif;font-size:20px;fill:#172033">白</text><rect x="572" y="192" width="80" height="80" fill="#4f8edb" stroke="#334155" stroke-width="2"/><text x="612" y="240" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:20px;fill:#fff">蓝</text><text class="small" x="580" y="292" text-anchor="middle">x=0 左列；x=1 右列</text><line x1="390" y1="185" x2="455" y2="185" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/><text class="small" x="420" y="165" text-anchor="middle">沿 y</text><text class="small" x="100" y="345">正视方向：y 负 → 正；前层对应图示下标 y=0。</text></svg>