<svg xmlns="http://www.w3.org/2000/svg" width="800" height="385" viewBox="0 0 800 385">
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:22px;font-weight:700}.label{font-size:16px}.small{font-size:13px}.grid{stroke:#64748b;stroke-width:1.4}.axis{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.cell{fill:#e8eef7;stroke:#475569;stroke-width:1.4}.blue{fill:#4f8edb;stroke:#1e3a5f;stroke-width:1.5}.ink{fill:#1f2937}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<text class="title" x="30" y="42">两向投影只给出轮廓高度，不给内部柱高</text><text class="label" x="60" y="92">主视：y 负方向看，按 x 从左到右</text><rect class="cell" x="95" y="180" width="88" height="100"/><text class="label" x="139" y="172" text-anchor="middle">2</text><text class="small" x="139" y="305" text-anchor="middle">x0</text><rect class="cell" x="195" y="230" width="88" height="50"/><text class="label" x="239" y="222" text-anchor="middle">1</text><text class="small" x="239" y="305" text-anchor="middle">x1</text><text class="label" x="430" y="92">左视：x 负方向看，按 y 从近到远</text><rect class="cell" x="470" y="180" width="88" height="100"/><text class="label" x="514" y="172" text-anchor="middle">2</text><text class="small" x="514" y="305" text-anchor="middle">y0</text><rect class="cell" x="570" y="230" width="88" height="50"/><text class="label" x="614" y="222" text-anchor="middle">1</text><text class="small" x="614" y="305" text-anchor="middle">y1</text><text class="small" x="60" y="344">各占地位置可有 0 到对应投影上限的柱高；整体连成从地面起的柱，不悬空。</text></svg>