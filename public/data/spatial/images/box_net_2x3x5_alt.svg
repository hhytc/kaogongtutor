<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430"><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:22px;font-weight:700}.label{font-size:17px}.small{font-size:14px}.cell{fill:#e8eef7;stroke:#475569;stroke-width:1.5}.blue{fill:#c8e0fa;stroke:#1e3a5f;stroke-width:1.5}</style><text class="title" x="28" y="38">长方体 2×3×5：2×3 端面贴在 3×5 侧面</text><rect class="cell" x="90" y="150" width="96" height="170"/><text class="label" x="138.0" y="240" text-anchor="middle">2×5</text><rect class="cell" x="186" y="150" width="144" height="170"/><text class="label" x="258.0" y="240" text-anchor="middle">3×5</text><rect class="cell" x="330" y="150" width="96" height="170"/><text class="label" x="378.0" y="240" text-anchor="middle">2×5</text><rect class="cell" x="426" y="150" width="144" height="170"/><text class="label" x="498.0" y="240" text-anchor="middle">3×5</text><rect class="blue" x="186" y="82" width="144" height="68"/><text class="small" x="258.0" y="130" text-anchor="middle">2×3 端面</text><text class="small" x="90" y="390">端面与 3×5 侧面共用长度为 3 的边；四个侧面依次连成一条带。</text></svg>