<svg xmlns="http://www.w3.org/2000/svg" width="810" height="420" viewBox="0 0 810 420">
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:22px;font-weight:700}.label{font-size:16px}.small{font-size:13px}.grid{stroke:#64748b;stroke-width:1.4}.axis{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.cell{fill:#e8eef7;stroke:#475569;stroke-width:1.4}.blue{fill:#4f8edb;stroke:#1e3a5f;stroke-width:1.5}.ink{fill:#1f2937}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<text class="title" x="28" y="38">同一张纸折叠后，投影占地缩小，纸张面积不变</text><rect x="90" y="110" width="360" height="240" fill="#f8fafc" stroke="#334155" stroke-width="2"/><line x1="270" y1="110" x2="270" y2="350" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 5"/><line x1="90" y1="230" x2="450" y2="230" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/><text class="label" x="270" y="95" text-anchor="middle">原纸 12×8</text><text class="small" x="270" y="218" text-anchor="middle">先沿竖直中线对折</text><text class="small" x="270" y="248" text-anchor="middle">再沿水平中线对折</text><rect x="560" y="170" width="180" height="120" class="blue"/><text class="label" x="650" y="158" text-anchor="middle">折后投影 6×4</text><text class="small" x="90" y="385">虚线为折线；纸没有被剪掉或拉伸。</text></svg>