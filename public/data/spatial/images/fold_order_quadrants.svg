<text class="title" x="28" y="38">纸面四象限标记（俯视，先后折叠方向见题干）</text><rect x="140" y="90" width="360" height="240" fill="#fff" stroke="#334155" stroke-width="2"/><line x1="320" y1="90" x2="320" y2="330" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><line x1="140" y1="210" x2="500" y2="210" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><text class="title" x="230" y="160" text-anchor="middle">A</text><text class="title" x="410" y="160" text-anchor="middle">B</text><text class="title" x="230" y="280" text-anchor="middle">C</text><text class="title" x="410" y="280" text-anchor="middle">D</text><text class="small" x="520" y="160">左半向右折</text><text class="small" x="520" y="190">上半向下折</text><text class="small" x="140" y="365">折叠后四层覆盖同一矩形；本题追踪层序，不求投影面积。</text></svg>